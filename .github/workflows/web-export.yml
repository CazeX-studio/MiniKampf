# Baut bei jedem Push auf main die Web-Version und veröffentlicht sie auf GitHub Pages.
name: Web-Export

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Godot und Export-Vorlagen zwischenspeichern
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}

      - name: Godot und Export-Vorlagen laden
        run: |
          mkdir -p ~/godot
          cd ~/godot
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          if [ ! -f godot ]; then
            curl -sSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
            unzip -q godot.zip && mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot && rm godot.zip
          fi
          if [ ! -d web_templates ]; then
            curl -sSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
            unzip -q templates.tpz "templates/web_*" && mv templates web_templates && rm templates.tpz
          fi
          target="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$target"
          cp web_templates/* "$target/"

      - name: Web-Version exportieren
        run: |
          mkdir -p builds/web
          # Gemalte Bilder verlustbehaftet speichern (etwa viermal kleiner, tools/web_bilder.py)
          python3 tools/web_bilder.py
          ~/godot/godot --headless --import || true
          # Versionsnummer (S1, 0.Stufe.Korrektur seit 12.11.): Nummer und Stufe aus data/version.json, dazu Datum und Stand
          stand="$(date -u +%Y-%m-%d) ($(git rev-parse --short HEAD))"
          python3 -c "import json,sys; p='data/version.json'; d=json.load(open(p)); d['version']=sys.argv[1]; json.dump(d, open(p,'w'), ensure_ascii=False, indent='\t')" "$stand"
          version="$(python3 -c "import json; d=json.load(open('data/version.json')); print(d['nummer'], d['stufe'], '·', d['version'])")"
          # Die Demo liegt unter spiel/ (ohne Editor und Testknöpfe), davor die Startseite (web/index.html, D36)
          mkdir -p builds/web/spiel
          ~/godot/godot --headless --export-release "Web" builds/web/spiel/index.html
          test -f builds/web/spiel/index.html
          # Werkstatt (S1): dieselbe Fassung mit Editor und Testknöpfen, unter einer nicht verlinkten Adresse
          werkstatt=$(python3 -c "import json; print(json.load(open('data/demo.json'))['werkstatt'])")
          mkdir -p "builds/web/$werkstatt"
          ~/godot/godot --headless --export-release "Werkstatt" "builds/web/$werkstatt/index.html"
          test -f "builds/web/$werkstatt/index.html"
          cp -r web/index.html web/bilder builds/web/
          sed -i "s|__VERSION__|$version|g" builds/web/index.html
          test -f builds/web/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: builds/web

  deploy:
    needs: export
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Versionsnummer (A24): Steht in data/version.json eine neue Nummer, setzt GitHub die Markierung v<nummer> selbst
  # auf diesen Stand (aus der Cloud dürfen keine Markierungen hochgeladen werden). Gibt es sie schon, passiert nichts.
  markierung:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Markierung für die Versionsnummer setzen
        run: |
          nummer="$(python3 -c "import json; print(json.load(open('data/version.json'))['nummer'])")"
          stufe="$(python3 -c "import json; print(json.load(open('data/version.json'))['stufe'])")"
          if git rev-parse -q --verify "refs/tags/v$nummer" >/dev/null; then
            echo "v$nummer gibt es schon"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "v$nummer" -m "$nummer $stufe (siehe AENDERUNGEN.md)"
            git push origin "v$nummer"
          fi
