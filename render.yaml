# Bauplan für den kostenlosen Online-Server bei Render (Anleitung: SERVER_ANLEITUNG.md)
services:
  - type: web
    name: asterfall-server
    runtime: docker
    plan: free
    # Frankfurt: kurzer Weg für Spieler in Deutschland
    region: frankfurt
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    branch: main
    autoDeploy: true
