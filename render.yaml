# Bauplan für den kostenlosen Online-Server bei Render (Anleitung: SERVER_ANLEITUNG.md)
services:
  - type: web
    name: asterfall-server
    runtime: docker
    plan: free
    # Frankfurt: kurzer Weg für Spieler in Deutschland
    region: frankfurt
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    branch: main
    autoDeploy: true
    # Die kostenlosen Bau-Minuten bei Render reichen nicht für einen Bau bei jedem Push (16.11.2026 aufgebraucht).
    # Darum baut Render den Server nur noch neu, wenn sich etwas im Ordner server/ ändert. Neuen Server gewünscht
    # (z. B. vor einem Testtag): in server/STAND.txt die Zeile mit dem Datum ändern, committen und pushen.
    buildFilter:
      paths:
        - "server/**"
        - "render.yaml"
