# Bauplan für den kostenlosen Online-Server bei Render (Anleitung: SERVER_ANLEITUNG.md)
services:
  - type: web
    name: asterfall-server
    runtime: docker
    plan: free
    # Frankfurt: kurzer Weg für Spieler in Deutschland
    region: frankfurt
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    branch: main
    autoDeploy: true
    # Nur neu bauen, wenn sich etwas am Spiel ändert (nicht bei Texten, Werkzeugen, Prüfungen oder der Webseite)
    buildFilter:
      ignoredPaths:
        - "**/*.md"
        - "tools/**"
        - "tests/**"
        - "web/**"
        - ".github/**"
